apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: exam-web
  template:
    metadata:
      labels:
        app: exam-web
    spec:
      containers:
        - name: web
          image: ghcr.io/replace-me/online-exam-web:latest
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: exam-web
spec:
  type: LoadBalancer
  selector:
    app: exam-web
  ports:
    - name: http
      port: 80
      targetPort: http
