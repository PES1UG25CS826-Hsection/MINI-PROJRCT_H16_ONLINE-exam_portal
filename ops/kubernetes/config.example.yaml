apiVersion: v1
kind: ConfigMap
metadata:
  name: exam-api-config
data:
  DATABASE_URL: jdbc:postgresql://postgres.example.internal:5432/online_exam
  DATABASE_USERNAME: exam_app
  REDIS_HOST: redis.example.internal
  REDIS_PORT: "6379"
  SERVER_PORT: "8080"
---
apiVersion: v1
kind: Secret
metadata:
  name: exam-api-secrets
type: Opaque
stringData:
  DATABASE_PASSWORD: replace-with-secret-manager-value
  SECURITY_TOKEN_SECRET: replace-with-unique-random-secret-at-least-32-characters
