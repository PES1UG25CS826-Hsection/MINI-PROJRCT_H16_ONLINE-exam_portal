services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-online_exam}
      POSTGRES_USER: ${POSTGRES_USER:-exam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exam}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-online_exam}
      DATABASE_USERNAME: ${POSTGRES_USER:-exam}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-exam}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
  web:
    build: ./frontend
    ports: ["${WEB_PORT:-3000}:80"]
    depends_on:
      api: { condition: service_started }
volumes:
  postgres_data:
  redis_data:
