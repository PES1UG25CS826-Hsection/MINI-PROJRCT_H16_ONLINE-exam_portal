server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: online-exam-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/online_exam}
    username: ${DATABASE_USERNAME:exam}
    password: ${DATABASE_PASSWORD:exam}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
